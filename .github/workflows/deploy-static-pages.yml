name: Deploy curated static demonstration

on:
  push:
    branches: [main]
    paths:
      - static_feasibility/**
      - .github/workflows/deploy-static-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble curated static artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude 'SpectrophotometryTargets/' \
            --exclude 'cronoscope logo.PNG' \
            --exclude 'cronoscope-mark.png' \
            static_feasibility/ _site/
          cp LICENSE THIRD_PARTY_NOTICES.md DATA_ATTRIBUTION.md PUBLICATION_ASSET_MANIFEST.md RELEASE1_PUBLICATION_MANIFEST.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
